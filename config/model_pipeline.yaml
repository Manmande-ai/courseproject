# ======================================================================
# 方案C 管道式 - Stage1: (Aspect, Opinion) 对抽取 超参配置
# ----------------------------------------------------------------------
# 模型: bert-base-chinese + BIO/CRF(span) + span MLP + 双仿射配对
# 训练脚本: src/pipeline/extract_pair.py
# 训练完成后会自动生成 model_pipeline_trained.yaml 快照(勿手工编辑)
# ======================================================================

pretrained: bert-base-chinese

labels:
  bio_tags: ["O", "B-ASP", "I-ASP", "B-OPN", "I-OPN"]

hyperparams:
  seed: 42
  max_len: 256
  batch_size: 8
  epochs: 6
  lr_bert: 2.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  dropout: 0.1
  dev_ratio: 0.15

# Stage1 专属: span 表示维度 / 配对损失权重 / 正样本权重 / 推理阈值搜索表
pair:
  mlp_dim: 200            # span 表示 g(s,e) 的维度
  loss_weight: 1.0        # L = CRF + loss_weight * pair_BCE
  pos_weight: 2.0         # BCE 正样本(真实对)权重, 候选格中正负约 1:5
  thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
