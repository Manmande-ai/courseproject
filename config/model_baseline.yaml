# --------------------------------------------------------------------
# spaCy 依存关系集合(Universal Dependencies / Chinese-GSD 标签)
#   ot_arc_rels     : 观点词 <-> 方面词 的直接依存弧
#   a_compound_rels : 名词性复合修饰(方面短语中心词向外跟随/复合块合并)
#   subj_rels       : 高信任谓词->名词关系(新词可直接接受为方面)
#   bridge_deps     : 2-hop 中介关系允许的桥接 dep
#   noun_pos        : 名词词性标签
# --------------------------------------------------------------------
syntax:
  ot_arc_rels:
  - acl
  - obj
  - obl
  - amod
  - attr
  - dobj
  - iobj
  - ccomp
  - nsubj
  - xcomp
  - obl:arg
  - acl:relcl
  - nsubj:pass
  - obl:patient
  a_compound_rels:
  - flat
  - nmod
  - compound
  - flat:name
  - compound:nn
  subj_rels:
  - acl
  - amod
  - attr
  - nsubj
  - acl:relcl
  - nsubj:pass
  bridge_deps:
  - dep
  - advcl
  - ccomp
  - xcomp
  - parataxis
  noun_pos:
  - NOUN
  - PROPN
