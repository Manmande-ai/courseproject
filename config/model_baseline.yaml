# Double-Propagation-ACOS 规则基线模型配置
# =====================================================================
# 由 src/model_baseline.py 中的模型常量导出, 脚本启动时自动加载本文件:
#   python src/model_baseline.py [--skip-test]
# 加载规则:
#   1. 本文件存在且已安装 PyYAML 时, 下列值覆盖代码内默认值, 修改后无需改代码;
#   2. 本文件缺失/未装 PyYAML/某字段缺省, 对应项自动回退到代码内默认值;
#   3. 词表在 YAML 中以列表书写, 加载后多数还原为 set(无序、自动去重);
#      final_particles / product_suffixes 还原为 tuple(保持顺序);
#      manual_category_kw 保持为 list(保留平局优先级顺序与重复词权重);
#   4. 规则归纳产物(opinion/aspect 词典等)仍由训练集动态生成并落盘于
#      data/baseline/lexicon_*.csv, 不在本文件配置。

# --------------------------------------------------------------------
# 极性标签(需与训练标注一致; 同时作为 lexicons.manual_seed 的键)
# --------------------------------------------------------------------
polarities:
  positive: 正面
  neutral: 中性
  negative: 负面

# --------------------------------------------------------------------
# 中文依存解析器(spaCy)
# --------------------------------------------------------------------
parser:
  spacy_model: zh_core_web_sm
  parse_batch_size: 256

# --------------------------------------------------------------------
# 运行超参
# --------------------------------------------------------------------
hyperparams:
  seed: 42
  dev_ratio: 0.15
  max_phrase_len: 8
  max_prop_iter: 8
  gap_window: 4
  df_prune: 0.5
  implicit_rate_min: 0.25
  implicit_rate_occ_min: 3

# --------------------------------------------------------------------
# 文本切分
# --------------------------------------------------------------------
text:
  clause_punct:
  - '!'
  - ','
  - .
  - ;
  - '?'
  - 、
  - 。
  - ！
  - ，
  - ；
  - ？

# --------------------------------------------------------------------
# 规则词表(模型的手工知识库)
#   manual_seed       : 通用中文情感种子(极性 -> 词), 补训练集未登录观点词
#   functional_verbs  : 功能性动词黑名单(不作观点/方面传播)
#   negators          : 否定词(作用域内极性翻转)
#   contrast_cc       : 转折并列(R4 极性翻转)
#   coord_cc          : 顺承并列(极性保持)
#   degree_adv        : 程度副词(修饰未知谓词时倾向情感表达)
#   final_particles   : 观点短语尾部语气词(高频茎优先时剥离), tuple
#   generic_targets   : 泛指名词(即使抽中也按隐式方面处理)
#   product_terms     : 产品品类名词(不作显式方面)
#   body_terms        : 身体部位词(不作显式方面)
#   split_block_heads : 名词块拆分尾中心(长复合块优先拆为两个方面词)
#   product_suffixes  : 品类后缀, tuple
#   opinion_stopwords : 观点噪声词(标注残留, 单独命中时丢弃)
#   person_terms      : 指人名词(不作方面)
#   aspect_stopwords  : 评价行为词(只作观点不作方面)
#   price_cue_terms   : 价格类无观点描述触发词(隐式正面观点)
#   manual_category_kw: 类别 -> 关键词(未登录类别兜底; 顺序即平局优先级)
#   char_category_kw  : 单字锚点(token 以该字结尾时命中 -> 类别)
# --------------------------------------------------------------------
